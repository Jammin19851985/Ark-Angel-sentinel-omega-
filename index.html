
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK Ω: THE ABSOLUTE MANIFESTATION</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --void-black: #050505;
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-glow-cyan: rgba(0, 243, 255, 0.6);
      --neon-glow-purple: rgba(188, 19, 254, 0.6);
      --amber-core: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.6);
      --glass-panel: rgba(10, 15, 20, 0.85);
      --grid-color: rgba(0, 243, 255, 0.05);
    }

    body {
      margin: 0;
      background-color: var(--void-black);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(188, 19, 254, 0.1) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(0, 243, 255, 0.05) 0%, transparent 40%);
      color: #e0e0e0;
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      transition: filter 0.5s ease;
    }

    body::after {
      content: '';
      position: fixed;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
      animation: scan 20s linear infinite;
      pointer-events: none;
      transform: perspective(1000px) rotateX(20deg);
      transition: transform 0.5s ease-out, opacity 1s ease-in-out;
    }

    @keyframes scan {
      0% { background-position: 0 0; }
      100% { background-position: 0 500px; }
    }

    .god-mode-active::after {
      --grid-color: rgba(245, 158, 11, 0.1);
      opacity: 0.8;
      animation: scan 40s linear infinite !important;
      transform: perspective(1000px) rotateX(15deg) translateY(20px);
    }

    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-display { font-family: 'Rajdhani', sans-serif; }

    .glow-text-cyan { text-shadow: 0 0 10px var(--neon-glow-cyan); }
    .glow-text-purple { text-shadow: 0 0 10px var(--neon-glow-purple); }
    .glow-text-amber { text-shadow: 0 0 10px var(--amber-glow); }
    
    .glow-border {
       box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
       border: 1px solid rgba(188, 19, 254, 0.3) !important;
       transition: all 0.3s ease;
    }

    .god-mode-active .glow-border,
    .god-mode-active button,
    .god-mode-active input,
    .god-mode-active textarea {
      border-color: var(--amber-core) !important;
      animation: amber-glow-pulse 3s infinite ease-in-out alternate;
    }
    
    @keyframes amber-glow-pulse {
      from { box-shadow: 0 0 5px var(--amber-glow); }
      to { box-shadow: 0 0 20px var(--amber-glow), 0 0 5px var(--amber-core); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 2px; }

    .hologram-circle {
        border: 2px solid var(--neon-cyan);
        border-radius: 50%;
        box-shadow: 0 0 30px var(--neon-glow-cyan), inset 0 0 15px var(--neon-glow-purple);
        animation: pulse 4s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }

    .singularity-scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: rgba(245, 158, 11, 0.1);
      z-index: 10000;
      pointer-events: none;
      animation: line-scan 4s linear infinite;
    }

    @keyframes line-scan {
      0% { top: -5%; }
      100% { top: 105%; }
    }

    .sonar-grid {
        position: absolute;
        inset: 0;
        background-image: 
            radial-gradient(circle, rgba(139, 92, 246, 0.1) 1px, transparent 1px),
            linear-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(139, 92, 246, 0.05) 1px, transparent 1px);
        background-size: 20px 20px;
    }

    .sonar-sweep {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(0deg, transparent 50%, rgba(139, 92, 246, 0.2) 100%);
        top: -100%;
        animation: sweep 4s linear infinite;
    }

    @keyframes sweep {
        from { top: -100%; }
        to { top: 100%; }
    }
  </style>

{

    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
</head>
<body class="bg-black">
  <div class="singularity-scanline"></div>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
