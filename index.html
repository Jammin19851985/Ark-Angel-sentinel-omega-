
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ARK Ω: THE ABSOLUTE MANIFESTATION</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700;800&family=Rajdhani:wght@300;500;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* --- CORE PALETTE (DEFAULT) --- */
      --bg-dark: #010101;
      --bg-panel: #030304;
      --primary: #00f3ff;
      --primary-dim: rgba(0, 243, 255, 0.1);
      --secondary: #bc13fe;
      --danger: #ff0044;
      --success: #00ff9d;
      --warning: #f59e0b;
      
      /* --- CYBERPUNK NEON PALETTE --- */
      --neon-green: #39ff14;
      --neon-pink: #ff00ff;
      --neon-blue: #00f3ff;
      
      /* --- 3D CHIP VARIABLES --- */
      --chip-bg: #09090b;
      --chip-border: #1e293b;
      --chip-highlight: rgba(255, 255, 255, 0.05);
      
      /* --- GOD MODE PALETTE (Overrides when active) --- */
      --god-primary: #ffd700;       /* Divine Gold */
      --god-secondary: #ffffff;     /* Pure Light */
      --god-glow: rgba(255, 215, 0, 0.6);
      --god-bg: #0a0800;            /* Deep Gold/Black */

      /* --- THEME VARIABLES --- */
      --bg-app: #010101;
      --bg-panel-rgb: 3, 3, 5;
      --bg-panel-border: rgba(0, 243, 255, 0.15);
      --text-main: #e0e0e0;
    }

    /* --- LIGHT THEME --- */
    body.light-theme {
      --bg-app: #f1f5f9; /* Slate 100 */
      --bg-panel-rgb: 255, 255, 255;
      --bg-panel-border: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      
      --primary: #00b4d8; /* Darker cyan for contrast */
      --primary-dim: rgba(0, 180, 216, 0.1);
    }

    body {
      margin: 0;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden; 
      height: 100vh;
      width: 100vw;
      /* DENSITY ADJUSTMENT: Tighter kerning */
      letter-spacing: 0.02em;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* --- THEME UTILITY OVERRIDES --- */
    body.light-theme .bg-black { background-color: var(--bg-app) !important; }
    body.light-theme .bg-black\/95 { background-color: rgba(var(--bg-panel-rgb), 0.95) !important; }
    body.light-theme .bg-black\/90 { background-color: rgba(var(--bg-panel-rgb), 0.9) !important; }
    body.light-theme .bg-black\/80 { background-color: rgba(var(--bg-panel-rgb), 0.8) !important; }
    body.light-theme .bg-black\/60 { background-color: rgba(var(--bg-panel-rgb), 0.8) !important; } /* Increased opacity for light mode panels */
    body.light-theme .bg-black\/50 { background-color: rgba(var(--bg-panel-rgb), 0.7) !important; }
    body.light-theme .bg-black\/40 { background-color: rgba(var(--bg-panel-rgb), 0.6) !important; }
    body.light-theme .bg-black\/30 { background-color: rgba(var(--bg-panel-rgb), 0.5) !important; }
    body.light-theme .bg-black\/20 { background-color: rgba(var(--bg-panel-rgb), 0.4) !important; }
    
    body.light-theme .bg-slate-900 { background-color: #e2e8f0 !important; } /* Slate 200 */
    body.light-theme .bg-slate-950 { background-color: #cbd5e1 !important; } /* Slate 300 */
    
    body.light-theme .border-slate-800 { border-color: #cbd5e1 !important; } /* Slate 300 */
    body.light-theme .border-slate-700 { border-color: #94a3b8 !important; } /* Slate 400 */
    
    body.light-theme .text-slate-100 { color: #0f172a !important; } /* Slate 900 */
    body.light-theme .text-slate-200 { color: #1e293b !important; } /* Slate 800 */
    body.light-theme .text-slate-300 { color: #334155 !important; } /* Slate 700 */
    body.light-theme .text-slate-400 { color: #475569 !important; } /* Slate 600 */
    body.light-theme .text-slate-500 { color: #64748b !important; } /* Slate 500 */
    body.light-theme .text-slate-600 { color: #94a3b8 !important; } /* Slate 400 */

    /* --- THE "50% VIEW" DENSITY HACK --- 
       We scale the root down to give more space, mimicking a zoomed-out interface 
       while keeping text vector-sharp.
    */
    #root {
      height: 100%;
      width: 100%;
      transform: scale(0.9); /* Slight zoom out to fit more */
      transform-origin: center center;
      /* We use flex layout to center the scaled app */
      display: flex;
      flex-direction: column;
    }

    /* --- GOD MODE OVERRIDES --- */
    body.god-mode-active {
      --primary: var(--god-primary);
      --primary-dim: rgba(255, 215, 0, 0.15);
      --secondary: var(--god-secondary);
      --chip-bg: #141105;
      --chip-border: #423605;
      background-image: 
        radial-gradient(circle at 50% -10%, rgba(255, 215, 0, 0.4) 0%, rgba(218, 165, 32, 0.2) 40%, transparent 80%),
        url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
      box-shadow: inset 0 0 100px rgba(255, 215, 0, 0.1);
    }

    /* --- TYPOGRAPHY --- */
    .font-mono { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; } /* Smaller Mono */
    .font-display { font-family: 'Orbitron', sans-serif; }
    
    /* --- TECH PANEL (FUTURISTIC CONTAINER) --- */
    .tech-panel {
      position: relative;
      background: rgba(3, 3, 5, 0.85); /* Darker, more opaque */
      border: 1px solid var(--border-color); 
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      clip-path: polygon(
        0 0, 
        100% 0, 
        100% calc(100% - 12px), 
        calc(100% - 12px) 100%, 
        0 100%
      );
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Light mode tech panel override handled by CSS vars where possible, or specific override */
    body.light-theme .tech-panel {
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    
    .tech-panel:hover {
        box-shadow: 0 0 25px var(--primary-dim);
        border-color: rgba(0, 243, 255, 0.3);
    }
    
    body.light-theme .tech-panel:hover {
        border-color: rgba(0, 180, 216, 0.5);
    }

    /* --- GLOWING BUTTONS (CYBERPUNK) --- */
    button, .cyber-button {
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease-out;
    }
    
    button:hover:not(:disabled) {
      text-shadow: 0 0 8px currentColor;
      box-shadow: 0 0 15px var(--primary-dim);
      border-color: var(--primary);
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* --- TECH HEADER --- */
    .tech-header {
      background: linear-gradient(90deg, rgba(0, 243, 255, 0.05) 0%, rgba(188, 19, 254, 0.05) 100%);
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    
    body.light-theme .tech-header {
        background: linear-gradient(90deg, rgba(0, 180, 216, 0.1) 0%, rgba(188, 19, 254, 0.1) 100%);
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* --- GRID BACKGROUND --- */
    .tech-grid-bg {
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center top;
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    /* --- ALIEN SWITCH --- */
    .alien-switch {
      position: relative;
      width: 36px;
      height: 18px;
      background: #0f172a;
      clip-path: polygon(15% 0, 100% 0, 85% 100%, 0% 100%);
      border: 1px solid #334155;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
    }
    
    body.light-theme .alien-switch {
        background: #e2e8f0;
        border-color: #cbd5e1;
        box-shadow: inset 0 0 2px rgba(0,0,0,0.2);
    }
    
    .alien-switch:hover {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .alien-switch.active {
      background: rgba(0, 243, 255, 0.2);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary);
    }

    .alien-switch-thumb {
      position: absolute;
      left: 2px;
      width: 12px;
      height: 12px;
      background: #64748b;
      clip-path: polygon(25% 0, 100% 0, 75% 100%, 0% 100%);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .alien-switch.active .alien-switch-thumb {
      left: 20px;
      background: #fff;
      box-shadow: 0 0 10px #fff;
    }

    /* --- UTILITIES --- */
    .glow-text-cyan { text-shadow: 0 0 10px var(--primary); }
    .glow-text-gold { text-shadow: 0 0 15px #ffd700; }
    .glow-border { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-dim); }

    /* --- SCANLINE & CRT EFFECTS --- */
    .scanline-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 999;
      opacity: 0.25; /* Intensified */
      mix-blend-mode: overlay;
    }
    
    body.light-theme .scanline-overlay {
        opacity: 0.05; /* Less intense in light mode */
        mix-blend-mode: multiply;
    }

    /* --- CYBER KEY (Buttons) --- */
    .cyber-key {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      transition: all 0.2s ease;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      position: relative;
      overflow: hidden;
    }
    body.light-theme .cyber-key {
        background: rgba(255,255,255,0.6);
        border: 1px solid rgba(0,0,0,0.1);
        color: #475569;
    }
    
    .cyber-key:hover {
      border-color: var(--primary);
      color: #fff;
      background: rgba(0, 243, 255, 0.1);
      box-shadow: 0 0 15px var(--primary);
      text-shadow: 0 0 5px var(--primary);
    }
    body.light-theme .cyber-key:hover {
        color: #000;
        text-shadow: none;
    }
    
    .cyber-key.active {
      background: rgba(0, 243, 255, 0.2);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.3), 0 0 10px var(--primary);
    }

    /* ANIMATIONS */
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-fast { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    body.light-theme ::-webkit-scrollbar-track { background: #f1f5f9; }
    
    ::-webkit-scrollbar-thumb { 
        background: #333; 
        border: 1px solid #000;
    }
    body.light-theme ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border: 1px solid #f1f5f9;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); box-shadow: 0 0 10px var(--primary); }

  </style>

</head>
<body class="bg-black text-slate-200">
  <div class="scanline-overlay"></div>
  <div id="root"></div>
