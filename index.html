<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK Ω: THE ABSOLUTE MANIFESTATION</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --void-black: #020202;
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-glow-cyan: rgba(0, 243, 255, 0.6);
      --neon-glow-purple: rgba(188, 19, 254, 0.6);
      --amber-core: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.6);
      --glass-panel: rgba(5, 7, 10, 0.9);
      --grid-color: rgba(0, 243, 255, 0.03);
      --aode-red: #ff0044;
    }

    body {
      margin: 0;
      background-color: var(--void-black);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(188, 19, 254, 0.15) 0%, transparent 70%),
        radial-gradient(circle at 100% 100%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
      color: #e0e0e0;
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
      opacity: 0.2;
      pointer-events: none;
      z-index: 100;
    }

    body::after {
      content: '';
      position: fixed;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: -1;
      animation: scan 30s linear infinite;
      pointer-events: none;
      transform: perspective(1000px) rotateX(30deg);
    }

    @keyframes scan {
      0% { background-position: 0 0; }
      100% { background-position: 0 600px; }
    }

    .god-mode-active {
      filter: contrast(1.1) saturate(1.2);
    }

    .god-mode-active::after {
      --grid-color: rgba(245, 158, 11, 0.12);
      animation: scan 15s linear infinite !important;
    }

    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-display { font-family: 'Rajdhani', sans-serif; }

    .glow-text-cyan { text-shadow: 0 0 15px var(--neon-glow-cyan); }
    .glow-text-purple { text-shadow: 0 0 15px var(--neon-glow-purple); }
    .glow-text-amber { text-shadow: 0 0 15px var(--amber-glow); }
    .glow-text-red { text-shadow: 0 0 15px rgba(255, 0, 68, 0.6); }
    
    .glow-border {
       box-shadow: 0 0 20px rgba(0, 243, 255, 0.05);
       border: 1px solid rgba(188, 19, 254, 0.25) !important;
       transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glow-border:hover {
      border-color: var(--neon-cyan) !important;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
    }

    .god-mode-active .glow-border {
      border-color: var(--amber-core) !important;
      box-shadow: 0 0 25px var(--amber-glow);
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
    ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }

    .hologram-circle {
        border: 1px solid var(--neon-cyan);
        border-radius: 50%;
        box-shadow: 0 0 40px var(--neon-glow-cyan), inset 0 0 20px var(--neon-glow-purple);
        animation: pulse 6s infinite ease-in-out;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.03); opacity: 1; }
    }

    .singularity-scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      z-index: 10000;
      pointer-events: none;
      animation: line-scan 3s linear infinite;
      opacity: 0.4;
    }

    @keyframes line-scan {
      0% { top: -5%; opacity: 0; }
      50% { opacity: 0.6; }
      100% { top: 105%; opacity: 0; }
    }

    .sonar-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid currentColor;
        border-radius: 50%;
        animation: sonar-expand 4s infinite linear;
    }

    @keyframes sonar-expand {
        0% { width: 0; height: 0; opacity: 1; }
        100% { width: 1000px; height: 1000px; opacity: 0; }
    }

    .sonar-grid {
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    .sonar-sweep {
      position: absolute;
      top: 50%; left: 50%;
      width: 50%; height: 50%;
      background: linear-gradient(45deg, transparent 50%, rgba(0, 243, 255, 0.2) 100%);
      transform-origin: top left;
      animation: sweep 4s infinite linear;
      border-right: 1px solid rgba(0, 243, 255, 0.5);
    }

    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Animation Utilities */
    .animate-spin-slow { animation: spin 8s linear infinite; }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .animate-fade-in-fast { animation: fadeIn 0.3s ease-out forwards; }
    .animate-pulse-slow { animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .holographic-engaged .glow-border {
        backdrop-filter: blur(12px);
        background: var(--glass-panel);
    }

    .neon-button {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--neon-glow-cyan);
      transition: all 0.3s;
    }

    .neon-button:hover {
      background: var(--neon-cyan);
      color: black;
      box-shadow: 0 0 30px var(--neon-cyan);
    }

    /* God Protocol Effects */
    .god-protocol-levitate { animation: levitate 3s ease-in-out infinite; }
    @keyframes levitate {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); filter: drop-shadow(0 20px 10px rgba(0,0,0,0.5)); }
    }

    .god-protocol-lightning { animation: flash 0.1s infinite; }
    @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; filter: brightness(2); }
    }

    .god-protocol-reset { animation: collapse 2s ease-in-out forwards; }
    @keyframes collapse {
        0% { transform: scale(1); filter: blur(0); }
        50% { transform: scale(0.01); filter: blur(20px); opacity: 0; }
        100% { transform: scale(1); filter: blur(0); opacity: 1; }
    }

    .god-protocol-heal { animation: heal 1.5s ease-out; }
    @keyframes heal {
        0% { box-shadow: inset 0 0 0 0 rgba(16, 185, 129, 0); }
        50% { box-shadow: inset 0 0 50px 20px rgba(16, 185, 129, 0.5); }
        100% { box-shadow: inset 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .god-protocol-create { animation: create 1s ease-out; }
    @keyframes create {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.3); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(245, 158, 11, 0.6); }

  </style>

{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0/",

    "@google/genai": "https://esm.sh/@google/genai@0.14.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
</head>
<body class="bg-black">
  <div class="singularity-scanline"></div>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
