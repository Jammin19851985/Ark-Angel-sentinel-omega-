
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK Ω: THE ABSOLUTE MANIFESTATION</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700;800&family=Rajdhani:wght@300;500;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* --- CORE PALETTE (DEFAULT) --- */
      --bg-dark: #020203;
      --bg-panel: #050508;
      --primary: #00f3ff;
      --primary-dim: rgba(0, 243, 255, 0.1);
      --secondary: #bc13fe;
      --danger: #ff0044;
      --success: #00ff9d;
      --warning: #f59e0b;
      
      /* --- CYBERPUNK NEON PALETTE --- */
      --neon-green: #39ff14;
      --neon-pink: #ff00ff;
      --neon-blue: #00f3ff;
      
      /* --- 3D CHIP VARIABLES --- */
      --chip-bg: #09090b;
      --chip-border: #1e293b;
      --chip-highlight: rgba(255, 255, 255, 0.05);
      
      /* --- GOD MODE PALETTE (Overrides when active) --- */
      --god-primary: #ffd700;       /* Divine Gold */
      --god-secondary: #ffffff;     /* Pure Light */
      --god-glow: rgba(255, 215, 0, 0.6);
      --god-bg: #0a0800;            /* Deep Gold/Black */
    }

    body {
      margin: 0;
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden; /* CRITICAL: Prevent body scroll, handle in app containers */
      height: 100vh;
      width: 100vw;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- GOD MODE OVERRIDES --- */
    body.god-mode-active {
      --primary: var(--god-primary);
      --primary-dim: rgba(255, 215, 0, 0.15);
      --secondary: var(--god-secondary);
      --chip-bg: #141105;
      --chip-border: #423605;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.1) 0%, transparent 60%),
        url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
    }

    /* --- TYPOGRAPHY --- */
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-display { font-family: 'Orbitron', sans-serif; }
    
    /* --- TECH PANEL (FUTURISTIC CONTAINER) --- */
    .tech-panel {
      position: relative;
      background: rgba(5, 5, 8, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      clip-path: polygon(
        0 0, 
        100% 0, 
        100% calc(100% - 8px), 
        calc(100% - 8px) 100%, 
        0 100%
      );
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .tech-panel:hover {
        box-shadow: 0 0 20px rgba(57, 255, 20, 0.05), 0 0 10px rgba(255, 0, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.15);
    }

    /* Panel Corner Accents - ASYMMETRIC NEON */
    .tech-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 10px; height: 10px;
      border-top: 1px solid var(--neon-green);
      border-left: 1px solid var(--neon-green);
      pointer-events: none;
      opacity: 0.8;
      z-index: 10;
      box-shadow: -1px -1px 5px var(--neon-green);
      transition: width 0.3s ease, height 0.3s ease;
    }
    .tech-panel:hover::before { width: 30px; height: 30px; }

    .tech-panel::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 10px; height: 10px;
      border-bottom: 1px solid var(--neon-pink);
      border-right: 1px solid var(--neon-pink);
      pointer-events: none;
      opacity: 0.8;
      z-index: 10;
      box-shadow: 1px 1px 5px var(--neon-pink);
      transition: width 0.3s ease, height 0.3s ease;
    }
    .tech-panel:hover::after { width: 30px; height: 30px; }

    /* --- TECH HEADER --- */
    .tech-header {
      background: linear-gradient(90deg, rgba(57, 255, 20, 0.05) 0%, rgba(255, 0, 255, 0.05) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .tech-header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0;
      width: 30px; height: 1px;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-pink));
      box-shadow: 0 0 8px var(--neon-green);
      animation: scan-width 4s infinite alternate;
    }

    @keyframes scan-width {
        0% { width: 10px; left: 0; }
        100% { width: 80px; left: 20%; }
    }

    /* --- GRID BACKGROUND --- */
    .tech-grid-bg {
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      background-position: center top;
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    /* --- ALIEN CYBERPUNK SWITCH --- */
    .alien-switch {
      position: relative;
      width: 40px;
      height: 20px;
      background: #0f172a;
      clip-path: polygon(15% 0, 100% 0, 85% 100%, 0% 100%);
      border: 1px solid #334155;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
    }
    
    .alien-switch:hover {
      border-color: var(--primary);
    }

    .alien-switch.active {
      background: rgba(0, 243, 255, 0.1);
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-dim), inset 0 0 10px rgba(0, 243, 255, 0.2);
    }
    
    .alien-switch.active-god {
      background: rgba(255, 215, 0, 0.1);
      border-color: #ffd700;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .alien-switch-thumb {
      position: absolute;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #475569;
      clip-path: polygon(25% 0, 100% 0, 75% 100%, 0% 100%);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    .alien-switch.active .alien-switch-thumb {
      left: 22px;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }
    
    .alien-switch.active-god .alien-switch-thumb {
      background: #ffd700;
      box-shadow: 0 0 15px #ffd700;
    }

    /* --- UTILITIES --- */
    .text-neon-green { color: var(--neon-green); text-shadow: 0 0 5px rgba(57,255,20,0.5); }
    .text-neon-pink { color: var(--neon-pink); text-shadow: 0 0 5px rgba(255,0,255,0.5); }
    .border-neon-green { border-color: var(--neon-green); }
    .border-neon-pink { border-color: var(--neon-pink); }
    
    .bg-neon-green-dim { background-color: rgba(57, 255, 20, 0.1); }
    .bg-neon-pink-dim { background-color: rgba(255, 0, 255, 0.1); }

    /* --- CUSTOM SCROLLBAR (NEON) --- */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #020203; }
    ::-webkit-scrollbar-thumb { 
        background: #333; 
        border-radius: 2px;
        transition: background 0.3s;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); box-shadow: 0 0 8px var(--primary); }

    /* --- GLOW EFFECTS --- */
    .glow-text-cyan { text-shadow: 0 0 8px var(--primary); }
    .glow-text-gold { text-shadow: 0 0 12px #ffd700; }
    .glow-border { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-dim); }

    /* --- SCANLINE & CRT EFFECTS --- */
    .scanline-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      z-index: 999; /* Higher than background but allowing interactions */
      opacity: 0.12;
      mix-blend-mode: overlay;
    }

    /* --- GOD MODE PARTICLES --- */
    .god-particles {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(circle, #ffd700 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0;
      transition: opacity 1s;
    }
    body.god-mode-active .god-particles { opacity: 0.12; }

    /* --- CYBER KEY --- */
    .cyber-key {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      transition: all 0.2s ease;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      position: relative;
      overflow: hidden;
    }
    .cyber-key:hover {
      border-color: var(--primary);
      color: #fff;
      background: rgba(0, 243, 255, 0.05);
      box-shadow: 0 0 10px var(--primary-dim);
    }
    .cyber-key.active {
      background: rgba(0, 243, 255, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
    }
    .cyber-key::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }
    .cyber-key:hover::before {
      left: 100%;
    }

    /* ANIMATIONS */
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-fast { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    .hover-glitch:hover {
      animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
      color: var(--neon-pink);
    }

  </style>

}
</script>
</head>
<body class="bg-black text-slate-200">
  <div class="scanline-overlay"></div>
  <div class="god-particles"></div>
  <div id="root"></div>

</body>
