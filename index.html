
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARK Ω: THE ABSOLUTE MANIFESTATION</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700;800&family=Rajdhani:wght@300;500;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* --- CORE PALETTE (DEFAULT) --- */
      --bg-dark: #050505;
      --bg-panel: #0a0a0f;
      --primary: #00f3ff;
      --primary-dim: rgba(0, 243, 255, 0.1);
      --secondary: #bc13fe;
      --danger: #ff0044;
      --success: #00ff9d;
      --warning: #f59e0b;
      
      /* --- 3D CHIP VARIABLES --- */
      --chip-bg: #0f1115;
      --chip-border: #334155;
      --chip-highlight: rgba(255, 255, 255, 0.08);
      --chip-shadow: rgba(0, 0, 0, 0.8);
      
      /* --- GOD MODE PALETTE (Overrides when active) --- */
      --god-primary: #ffd700;       /* Divine Gold */
      --god-secondary: #ffffff;     /* Pure Light */
      --god-glow: rgba(255, 215, 0, 0.6);
      --god-bg: #1a1500;            /* Deep Gold/Black */
      --god-panel: #2a2205;
    }

    body {
      margin: 0;
      background-color: var(--bg-dark);
      color: #e0e0e0;
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- GOD MODE OVERRIDES --- */
    body.god-mode-active {
      --primary: var(--god-primary);
      --primary-dim: rgba(255, 215, 0, 0.15);
      --secondary: var(--god-secondary);
      --chip-bg: #221d0a;
      --chip-border: #785e08;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.2) 0%, transparent 60%),
        url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
    }

    /* --- TYPOGRAPHY --- */
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-display { font-family: 'Orbitron', sans-serif; }
    
    /* --- 3D CYBER CHIP CONTAINER --- */
    .cyber-chip {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      box-shadow: 
        inset 1px 1px 0px var(--chip-highlight),
        inset -1px -1px 0px rgba(0,0,0,0.5),
        0 10px 20px rgba(0,0,0,0.5);
      position: relative;
      border-radius: 4px;
      overflow: hidden;
    }

    .cyber-chip::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--chip-highlight), transparent);
      opacity: 0.5;
    }

    /* Screws/Rivets corners */
    .cyber-chip-screws::after {
      content: '+';
      position: absolute;
      top: 2px; right: 4px;
      font-family: monospace;
      color: var(--chip-border);
      font-size: 10px;
    }

    /* --- INSET SCREEN / TERMINAL EFFECT --- */
    .cyber-inset {
      background: rgba(0, 0, 0, 0.4);
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8), inset -1px -1px 0px rgba(255,255,255,0.05);
      border: 1px solid rgba(0,0,0,0.8);
      border-radius: 4px;
    }

    /* --- BUTTONS: PHYSICAL KEYS --- */
    .cyber-key {
      background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
      border: 1px solid #4a5568;
      box-shadow: 
        0 4px 0 #000,
        0 5px 5px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.1);
      color: #a0aec0;
      transition: all 0.1s ease;
      transform: translateY(0);
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      border-radius: 2px;
    }

    .cyber-key:hover {
      background: linear-gradient(180deg, #353f52 0%, #202735 100%);
      color: #fff;
      border-color: var(--primary);
    }

    .cyber-key:active, .cyber-key.active {
      transform: translateY(4px);
      box-shadow: 
        0 0 0 #000,
        inset 0 2px 5px rgba(0,0,0,0.8);
      color: var(--primary);
      background: #111;
      border-color: var(--primary);
    }

    body.god-mode-active .cyber-key:active, 
    body.god-mode-active .cyber-key.active {
      color: var(--god-primary);
      border-color: var(--god-primary);
      text-shadow: 0 0 5px var(--god-primary);
    }

    /* --- HOLOGRAPHIC GLOWS --- */
    .glow-text-cyan { text-shadow: 0 0 10px var(--primary); }
    .glow-text-gold { text-shadow: 0 0 15px #ffd700, 0 0 30px #b45309; }
    
    .glow-border {
       border: 1px solid var(--primary-dim);
       box-shadow: 0 0 15px var(--primary-dim);
    }

    /* --- SCANLINE & CRT EFFECTS --- */
    .scanline-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.15;
    }

    .hologram-flicker {
      animation: flicker 4s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      5% { opacity: 0.8; }
      10% { opacity: 0.9; }
      15% { opacity: 0.5; }
      20% { opacity: 0.95; }
      100% { opacity: 0.95; }
    }

    /* --- CUSTOM SCROLLBAR --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050505; border-left: 1px solid #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 0; border: 1px solid #000; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    /* --- GOD MODE PARTICLES --- */
    .god-particles {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(circle, #ffd700 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0;
      transition: opacity 1s;
    }
    body.god-mode-active .god-particles { opacity: 0.2; }

  </style>
</head>
<body class="bg-black">
  <div class="scanline-overlay"></div>
  <div class="god-particles"></div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
